[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "careecho"
version = "0.1.0"
description = "Evidence-linked discharge teach-back review with local speech recognition"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.9,<3"]

[project.optional-dependencies]
app = ["streamlit>=1.40,<2"]
asr = ["faster-whisper>=1.1,<2", "av>=11,<17"]
llm = ["openai>=2,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
careecho = "careecho.cli:main"

[tool.setuptools.packages.find]
include = ["careecho*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
